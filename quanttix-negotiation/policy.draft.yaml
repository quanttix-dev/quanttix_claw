# policy.draft.yaml
# Politica de negociacao - DRAFT inicial v0.2
# Atualizado: 2026-05-10
#
# 4 cenarios (tiers) com 2 niveis de margem por tipo_titulo:
#   - AR-vip       : cliente VIP        | max desconto 5%
#   - AR-padrao    : cliente padrao     | max desconto 10%
#   - AP-estrategico: fornecedor estrategico | max desconto 5%
#   - AP-padrao    : fornecedor padrao  | max desconto 10%
#
# Sem parcelamento nesta versao (max_parcelas=1). Escalation em 70% do
# max_desconto (3.5% e 7% respectivamente).
#
# Versao editorial (humana). A copia operacional sera promovida ao
# backend em src/treasury/config/negotiation_policy.yaml quando o
# Estagio 1 for implementado, e carregada pelo endpoint REST
# GET /api/v1/tesouraria/negotiation/policy.

version: "0.2-draft"
tenant_id: null  # null = global; reservado para multi-tenant

rules:
  # ====================================================================
  # AR - cobranca de cliente VIP (conservador, prioriza relacionamento)
  # ====================================================================
  - id: "AR-vip"
    descricao: "Cliente VIP - margem reduzida, foco em relacionamento"
    tipo_titulo: "AR"
    tier: "vip"
    valor_min: 0.00
    valor_max: null
    max_desconto_pct: 5.0
    max_parcelas: 1
    max_prazo_dias_extra: 30
    juros_mensal_min_pct: 0.0
    escalation_threshold_pct: 3.5   # 70% de 5%
    bloqueio_score_min: 0           # cliente VIP nao bloqueia por score
    bloqueio_em_protesto: true

  # ====================================================================
  # AR - cobranca de cliente padrao (maior margem)
  # ====================================================================
  - id: "AR-padrao"
    descricao: "Cliente padrao - margem ampla"
    tipo_titulo: "AR"
    tier: "padrao"
    valor_min: 0.00
    valor_max: null
    max_desconto_pct: 10.0
    max_parcelas: 1
    max_prazo_dias_extra: 30
    juros_mensal_min_pct: 0.0
    escalation_threshold_pct: 7.0   # 70% de 10%
    bloqueio_score_min: 300
    bloqueio_em_protesto: true

  # ====================================================================
  # AP - fornecedor estrategico (conservador, prioriza relacionamento)
  # ====================================================================
  - id: "AP-estrategico"
    descricao: "Fornecedor estrategico - pedido moderado, sem agressividade"
    tipo_titulo: "AP"
    tier: "estrategico"
    valor_min: 0.00
    valor_max: null
    max_desconto_pct: 5.0           # desconto que pedimos ao fornecedor
    max_parcelas: 1
    max_prazo_dias_extra: 15        # extensao moderada
    juros_mensal_min_pct: 0.0
    escalation_threshold_pct: 3.5
    bloqueio_score_min: 0
    bloqueio_em_protesto: false

  # ====================================================================
  # AP - fornecedor padrao (margem ampla)
  # ====================================================================
  - id: "AP-padrao"
    descricao: "Fornecedor padrao - margem ampla"
    tipo_titulo: "AP"
    tier: "padrao"
    valor_min: 0.00
    valor_max: null
    max_desconto_pct: 10.0
    max_parcelas: 1
    max_prazo_dias_extra: 30
    juros_mensal_min_pct: 0.0
    escalation_threshold_pct: 7.0
    bloqueio_score_min: 0
    bloqueio_em_protesto: false

defaults:
  expiracao_proposta_horas: 48
  max_propostas_por_dia_por_contraparte: 3
  max_negociacoes_simultaneas_global: 100
  rodada_maxima: 5            # apos 5 trocas, escala pra humano
